server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_db?serverTimezone=UTC
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.crm: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: crm-secret-key-change-in-production
    expiration: 86400000
